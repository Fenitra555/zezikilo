<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test WebSocket Zezik'Ilo</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
        textarea { width: 100%; height: 100px; }
        button { padding: 0.5rem 1rem; margin: 0.5rem 0; }
        #log {
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 1rem;
            height: 300px;
            overflow-y: auto;
            border-radius: 0.25rem;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Test WebSocket – Zezik'Ilo</h1>

    <p><strong>1.</strong> Collez le token JWT obtenu via <code>/api/auth/login</code> :</p>
    <textarea id="token" placeholder="eyJhbGciOi..."></textarea>

    <button id="connect">Se connecter</button>
    <button id="disconnect">Se déconnecter</button>

    <h2>Logs</h2>
    <div id="log"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        const logEl = document.getElementById('log');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('connect').addEventListener('click', () => {
            const token = document.getElementById('token').value.trim();
            if (!token) { log('❌ Token requis'); return; }

            log('Connexion en cours...');
            socket = io({
                auth: { token }
            });

            socket.on('connect', () => log(`✅ Connecté (id=${socket.id})`));
            socket.on('disconnect', (reason) => log(`❌ Déconnecté : ${reason}`));
            socket.on('connect_error', (err) => log(`💥 Erreur : ${err.message}`));
        });

        document.getElementById('disconnect').addEventListener('click', () => {
            if (socket) {
                socket.disconnect();
                socket = null;
                log('Déconnexion manuelle');
            }
        });
    </script>
</body>
</html>
